@if (variant() === 'icon') {
  <button class="logout-icon" type="button" aria-label="Cerrar sesión, próximamente" disabled title="Próximamente">
    <app-icon name="logout" />
  </button>
} @else {
  <button class="logout-row" type="button" disabled title="Próximamente">
    <app-icon name="logout" /><span
      ><strong>Cerrar sesión · Próximamente</strong><small>Salir de tu cuenta en este dispositivo</small></span
    ><app-icon name="chevron" />
  </button>
}
